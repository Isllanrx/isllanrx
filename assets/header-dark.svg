<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Isllan Toso — Software Engineer, Data and Backend" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .flow, .cursor, .pulse { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161C25" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0F14" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0B0F14" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0B0F14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0B0F14"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#fade)"/>

  <text x="64" y="92" class="mono" font-size="16" fill="#5B6B80">~/isllan <tspan fill="#2DD4BF">$</tspan> whoami<tspan class="cursor" fill="#2DD4BF">_</tspan></text>
  <text x="62" y="162" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#E6EDF3">Isllan Toso</text>
  <text x="64" y="204" class="sans" font-size="22" fill="#9AA7B8">Software Engineer <tspan fill="#2DD4BF">/</tspan> Data &amp; Backend</text>
  <text x="64" y="244" class="mono" font-size="15" fill="#5B6B80">python · sql · databricks · java · typescript</text>

  <g fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round">
    <path class="flow" d="M910 88 C 950 88, 940 150, 980 150"/>
    <path class="flow" d="M1065 174 C 1065 214, 960 212, 910 212"/>
  </g>
  <g class="mono" font-size="14">
    <rect x="740" y="64" width="170" height="48" rx="10" fill="#111821" stroke="#243042"/>
    <circle class="pulse" cx="762" cy="88" r="4" fill="#2DD4BF"/>
    <text x="776" y="93" fill="#E6EDF3">ingest</text>
    <rect x="980" y="126" width="170" height="48" rx="10" fill="#111821" stroke="#243042"/>
    <circle class="pulse d2" cx="1002" cy="150" r="4" fill="#2DD4BF"/>
    <text x="1016" y="155" fill="#E6EDF3">transform</text>
    <rect x="740" y="188" width="170" height="48" rx="10" fill="#111821" stroke="#243042"/>
    <circle class="pulse d3" cx="762" cy="212" r="4" fill="#2DD4BF"/>
    <text x="776" y="217" fill="#E6EDF3">serve</text>
  </g>
</svg>
