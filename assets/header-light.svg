<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Isllan Toso — Software Engineer, Full-Stack and Backend" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; }
    .check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 4.8s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes draw { 0%,35% { stroke-dashoffset: 30; } 55%,100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .cursor, .pulse { animation: none; } .check { animation: none; stroke-dashoffset: 0; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E6EAEF" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#F6F8FA" stop-opacity="1"/>
      <stop offset=".55" stop-color="#F6F8FA" stop-opacity=".6"/>
      <stop offset="1" stop-color="#F6F8FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#F6F8FA"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#fade)"/>

  <text x="64" y="92" class="mono" font-size="16" fill="#6B7788">~/isllan <tspan fill="#0F766E">$</tspan> git commit -m "ship it"<tspan class="cursor" fill="#0F766E">_</tspan></text>
  <text x="62" y="162" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#0B0F14">Isllan Toso</text>
  <text x="64" y="204" class="sans" font-size="22" fill="#3D4A5C">Software Engineer <tspan fill="#0F766E">/</tspan> Full-Stack &amp; Backend</text>
  <text x="64" y="244" class="mono" font-size="15" fill="#6B7788">typescript · rust · python · react · node</text>

  <g fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round">
    <path class="flow" d="M910 88 C 950 88, 940 150, 980 150"/>
    <path class="flow" d="M1065 174 C 1065 214, 960 212, 910 212"/>
  </g>
  <g class="mono" font-size="14">
    <rect x="740" y="64" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
    <circle class="pulse" cx="762" cy="88" r="4" fill="#0F766E"/>
    <text x="776" y="93" fill="#0B0F14">commit</text>
    <text x="890" y="93" fill="#6B7788" text-anchor="end" font-size="12">main</text>
    <rect x="980" y="126" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
    <circle class="pulse d2" cx="1002" cy="150" r="4" fill="#0F766E"/>
    <text x="1016" y="155" fill="#0B0F14">build &amp; test</text>
    <rect x="740" y="188" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
    <circle class="pulse d3" cx="762" cy="212" r="4" fill="#0F766E"/>
    <text x="776" y="217" fill="#0B0F14">deploy</text>
    <path class="check" d="M872 212 l6 6 l12 -13" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
